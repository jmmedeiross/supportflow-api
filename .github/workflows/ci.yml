name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SupportFlow.slnx

      - name: Build
        run: dotnet build SupportFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SupportFlow.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
